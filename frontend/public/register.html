
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | DiabetesCare</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a class="logo" href="/">DiabetesCare</a>
            <nav>
                <a href="/">Home</a>
                <a href="/login.html">Login</a>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-card">
            <h1>Create your account</h1>
            <p>Register to save and review your assessments.</p>

            <form id="registerForm">
                <div>
                    <label for="name">Full name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div>
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <p>Use at least 8 characters.</p>
                </div>

                <button type="submit">Create Account</button>
                <p id="registerMessage" role="status" aria-live="polite"></p>
            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="/login.html">Log in</a>
            </p>
        </section>
    </main>

    <footer>
        <p>DiabetesCare — Diabetes risk assessment project</p>
    </footer>

    <script src="/js/auth.js"></script>
</body>
</html>
